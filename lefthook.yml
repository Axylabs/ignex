# Pre-commit / pre-push hooks — https://github.com/evilmartians/lefthook
# Install once per clone: `bunx lefthook install`

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,json,jsonc,html,md}"
      run: bunx biome check --write --staged {staged_files} && git add {staged_files}
    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx oxlint {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck && bun run typecheck:cli
    jsdoc:
      run: bun run jsdoc:check:strict
    test:
      run: bun run test
    cache-versions:
      # Codegen/native-loader changes must bump the compiler cache version so
      # stale consumer caches can't serve the previous build.
      run: bun run check:cache-versions
