# Pre-commit / pre-push hooks — https://github.com/evilmartians/lefthook
# Install once per clone: `bunx lefthook install`

pre-commit:
  parallel: true
  commands:
    qlty:
      # Git-aware umbrella check (oxc + actionlint + zizmor + trufflehog); only
      # reports issues on new/changed lines. Install tools once: `qlty install`.
      run: qlty check --no-formatters
    biome:
      # Only file types Biome actually processes here — adding `html`/`md` made
      # a docs-/workflow-only commit fail ("No files were processed in the
      # specified paths"), because Biome ignores those and exits non-zero.
      glob: "*.{js,ts,jsx,tsx,json,jsonc}"
      run: bunx biome check --write --staged {staged_files} && git add {staged_files}
    oxlint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx oxlint {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck && bun run typecheck:cli
    jsdoc:
      run: bun run jsdoc:check:strict
    test:
      run: bun run test
    cache-versions:
      # Codegen/native-loader changes must bump the compiler cache version so
      # stale consumer caches can't serve the previous build.
      run: bun run check:cache-versions
