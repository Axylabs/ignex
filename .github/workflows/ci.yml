name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the Bun version (was `latest` — un-pinned drift across CI runs). Track the
# version the workspace is verified on (root package.json `engines.bun >= 1.4`);
# bump deliberately, never silently via `latest`.
env:
  BUN_VERSION: 1.4.0
  # Pin the castrum addon revision CI builds against — previously the DEFAULT
  # BRANCH floated, so CI validated a moving target that could be ahead of the
  # `^0.9.1` production install (a parity pass proved nothing about what users
  # actually get). Pinned to the exact revision every gate here was validated
  # against (tag v0.9.3). To move: bump BOTH this and
  # packages/native/package.json's optionalDependency deliberately, run
  # `bun run verify:native:ffi && bun run verify:native:route` locally first,
  # and keep vendor/castrum.d.ts in sync (`bun run check:native:surface`).
  CASTRUM_REF: 0d8e4e84a96420e5dfcc2e6528a7c80303d200bf

jobs:
  # Fast, dependency-free gate: fail on any tracked file containing a likely
  # credential (npm/GitHub/AWS tokens, PEM private keys). Runs before install —
  # the scanner uses only `git ls-files` + `git show` (see scripts/scan-secrets.ts).
  secret-scan:
    name: Secret scan (no credentials in tracked files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for credentials
        run: bun scripts/scan-secrets.ts

  # Software supply-chain scanning (OSV): scans bun.lock + workspace manifests
  # against the OSV vulnerability database and reports findings as a SARIF
  # upload for the GitHub Security tab. Mirrors castrum's supply-chain job.
  supply-chain:
    name: Supply-chain scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OSV scan
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            .

  # Quality gates across ALL supported platforms. Linux is the authoritative
  # lane (native addon present); macOS/Windows exercise the pure-TS fallback
  # end-to-end — typecheck, lint, tests, AOT build and both smoke modes must
  # pass WITHOUT an addon, which is what every non-linux-x64 user actually runs.
  quality:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # JS dependency audit: blocks on known high/critical advisories in the
      # resolved tree. Mirrors castrum's audit gate so both repos of the
      # framework meet the same supply-chain bar. Once per push (Linux lane).
      - name: JS dependency audit
        if: runner.os == 'Linux'
        run: bun audit --audit-level=high

      - name: Typecheck (root)
        run: bun run typecheck

      - name: Typecheck (CLI)
        run: bun run typecheck:cli

      - name: Lint (oxlint + biome)
        run: bun run lint

      - name: JSDoc completeness (every public export documented)
        run: bun run jsdoc:check:strict

      - name: Test + coverage thresholds
        run: bun run test:coverage

      - name: Native bench sanity (fallback mode — no addon in this job)
        if: runner.os == 'Linux'
        run: bun run bench:native

      - name: Build (AOT compile example app)
        run: bun run build

      - name: Smoke (boot server + assert all routes/flows)
        run: bun run smoke

      - name: Smoke (fallback mode — no native addon on this lane)
        run: bun run smoke:fallback

      # AOT-compile + boot checks that the vitest suites don't cover (they need
      # plain Bun, not a vitest worker): RBAC guard-chain emission and the CLI
      # resource→AOT flow. Plus the release pre-flight: codegen/native-loader
      # changes must bump the compiler cache version.
      - name: AOT RBAC guard-chain verify
        run: bun run verify:aot:rbac

      - name: CLI resource → AOT verify
        run: bun run verify:cli:resource

      - name: Compiler cache-version check (vs last tag)
        if: runner.os == 'Linux'
        run: bun run check:cache-versions

      - name: Upload coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  # Real-addon parity on EVERY desktop/server platform: build the castrum NAPI
  # addon FROM SOURCE on each OS and run the native suites against it. This is
  # the gate that ends "linux-x64-only" drift — macOS (arm64) and Windows
  # (x64-msvc) prove the addon compiles AND passes byte-parity off-Linux, and
  # the loader discovers the platform binary without IGNEX_NATIVE_PATH hints.
  # Non-Linux lanes are currently allow-listed (`continue-on-error`) until
  # castrum publishes/verifies those targets — flip them to blocking as soon
  # as they go green; do NOT remove them.
  native-parity:
    name: Native parity (real addon, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    continue-on-error: ${{ runner.os != 'Linux' }}
    steps:
      - name: Checkout ignex
        uses: actions/checkout@v4

      - name: Checkout castrum (Rust addon)
        uses: actions/checkout@v4
        with:
          # Repo from castrum's package.json `repository` field, PINNED to the
          # tested revision (env.CASTRUM_REF) — never the floating default branch.
          repository: Axylabs/flux-rs
          ref: ${{ env.CASTRUM_REF }}
          path: castrum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ignex dependencies
        run: bun install --frozen-lockfile

      - name: Build castrum addon
        working-directory: castrum
        run: |
          bun install --frozen-lockfile
          bun run build

      # Locate this platform's addon binary generically (naming varies by
      # target triple: linux-x64-gnu, darwin-arm64, win32-x64-msvc, …) instead
      # of hardcoding the Linux filename.
      - name: Locate built addon
        shell: bash
        run: |
          ADDON=$(find castrum -name '*.node' -type f | head -1)
          if [ -z "$ADDON" ]; then
            echo "::error::No .node addon produced by castrum build on ${RUNNER_OS}"
            exit 1
          fi
          echo "IGNEX_NATIVE_PATH=$(pwd)/$ADDON" >> "$GITHUB_ENV"
          echo "Addon: $ADDON"

      # vendor/castrum.d.ts is the compile-time contract for @ignex/native —
      # fail loudly when the real addon surface drifts from it (renamed or
      # removed runtime exports would otherwise typecheck but break at runtime).
      - name: Native type-stub surface check
        run: bun run check:native:surface

      - name: Native parity + benchmark (real addon)
        run: |
          bun run test:native:real
          bun scripts/native-bench.ts

      # C-ABI scalar + per-route parity under PLAIN Bun (vitest workers can't
      # dlopen bun:ffi) — the ONLY checks that exercise the C-ABI bindings
      # directly. Hard gate: a binding/parity regression must fail loudly.
      - name: C-ABI scalar parity (plain Bun, real addon)
        run: bun run verify:native:ffi

      - name: Per-route native stack parity (plain Bun, real addon)
        run: bun run verify:native:route

      # C-ABI (bun:ffi) is the PRIMARY transport — force it so a bind/self-test
      # regression (or a Bun/ABI drift) fails loudly instead of silently falling
      # back to NAPI. `IGNEX_FFI_MODE=ffi` throws on any ffi failure.
      - name: Native tests — C-ABI (bun:ffi) forced
        env:
          IGNEX_FFI_MODE: ffi
        run: bun run test:native

      # NAPI stays the fallback (Node / stateful classes) — verify it still
      # passes parity when C-ABI is explicitly disabled.
      - name: Native tests — NAPI forced
        env:
          IGNEX_FFI_MODE: napi
        run: bun run test:native

      # Batch + task-group stability gate: 12 batch entry points x 40 trials
      # must return 0 malformed results (exits non-zero otherwise).
      - name: Batch + task-group stability probe
        run: bun scripts/bench-batch.ts --probe

  # End-to-end compiled-server regression gate (native on vs fallback).
  # Benchmarks the AOT-compiled app server and compares native req/s against
  # the committed baseline + the in-run fallback (see scripts/check-server-bench.ts).
  # `bench/results/server/baseline.json` is COMMITTED — machine-sensitive, so
  # this gate intentionally stays LINUX-ONLY (a committed baseline measured on
  # one runner class cannot arbitrate regressions measured on another).
  # HARD gate: the previous /api/big native-mode overhead (~15-16%) was resolved
  # (re-measured ~2% on 2026-08-19), so the perf regression gate can fail CI again.
  server-bench:
    name: Server bench gate (real addon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ignex
        uses: actions/checkout@v4

      - name: Checkout castrum (Rust addon)
        uses: actions/checkout@v4
        with:
          repository: Axylabs/flux-rs
          path: castrum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ignex dependencies
        run: bun install --frozen-lockfile

      - name: Build castrum addon
        working-directory: castrum
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: End-to-end server bench (native vs fallback)
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
          REPEATS: "2"
          DURATION: "2"
          WARMUP: "1"
        run: bun scripts/bench-server.ts

      - name: Regression gate
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
        run: bun scripts/check-server-bench.ts

