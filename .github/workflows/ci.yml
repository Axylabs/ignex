name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the Bun version (was `latest` — un-pinned drift across CI runs). Track the
# version the workspace is verified on (root package.json `engines.bun >= 1.4`);
# bump deliberately, never silently via `latest`.
env:
  BUN_VERSION: 1.4.0

jobs:
  # Fast, dependency-free gate: fail on any tracked file containing a likely
  # credential (npm/GitHub/AWS tokens, PEM private keys). Runs before install —
  # the scanner uses only `git ls-files` + `git show` (see scripts/scan-secrets.ts).
  secret-scan:
    name: Secret scan (no credentials in tracked files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for credentials
        run: bun scripts/scan-secrets.ts

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (root)
        run: bun run typecheck

      - name: Typecheck (CLI)
        run: bun run typecheck:cli

      - name: Lint (oxlint + biome)
        run: bun run lint

      - name: JSDoc completeness (every public export documented)
        run: bun run jsdoc:check:strict

      - name: Test + coverage thresholds
        run: bun run test:coverage

      - name: Native bench sanity (fallback mode — no addon in this job)
        run: bun run bench:native

      - name: Build (AOT compile example app)
        run: bun run build

      - name: Smoke (boot server + assert all routes/flows)
        run: bun run smoke

      - name: Smoke (fallback mode — no native addon in this job)
        run: bun run smoke:fallback

      # AOT-compile + boot checks that the vitest suites don't cover (they need
      # plain Bun, not a vitest worker): RBAC guard-chain emission and the CLI
      # resource→AOT flow. Plus the release pre-flight: codegen/native-loader
      # changes must bump the compiler cache version.
      - name: AOT RBAC guard-chain verify
        run: bun run verify:aot:rbac

      - name: CLI resource → AOT verify
        run: bun run verify:cli:resource

      - name: Compiler cache-version check (vs last tag)
        run: bun run check:cache-versions

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  # Real-addon parity: build the castrum NAPI addon and run the native suites
  # against it (nativePreflight terminal responses, RateLimiter, parity vectors).
  # A hard gate: native parity regressions must fail loudly (the JS fallback
  # would otherwise mask them silently).
  native-parity:
    name: Native parity (real addon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ignex
        uses: actions/checkout@v4

      - name: Checkout castrum (Rust addon)
        uses: actions/checkout@v4
        with:
          # Repo from castrum's package.json `repository` field.
          repository: Axylabs/flux-rs
          path: castrum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ignex dependencies
        run: bun install --frozen-lockfile

      - name: Build castrum addon
        working-directory: castrum
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Native parity + benchmark (real addon)
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
        run: |
          bun run test:native:real
          bun scripts/native-bench.ts

      # C-ABI scalar + per-route parity under PLAIN Bun (vitest workers can't
      # dlopen bun:ffi) — the ONLY checks that exercise the C-ABI bindings
      # directly. Hard gate: a binding/parity regression must fail loudly.
      - name: C-ABI scalar parity (plain Bun, real addon)
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
        run: bun run verify:native:ffi

      - name: Per-route native stack parity (plain Bun, real addon)
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
        run: bun run verify:native:route

      # C-ABI (bun:ffi) is the PRIMARY transport — force it so a bind/self-test
      # regression (or a Bun/ABI drift) fails loudly instead of silently falling
      # back to NAPI. `IGNEX_FFI_MODE=ffi` throws on any ffi failure.
      - name: Native tests — C-ABI (bun:ffi) forced
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
          IGNEX_FFI_MODE: ffi
        run: bun run test:native

      # NAPI stays the fallback (Node / stateful classes) — verify it still
      # passes parity when C-ABI is explicitly disabled.
      - name: Native tests — NAPI forced
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
          IGNEX_FFI_MODE: napi
        run: bun run test:native

      # Batch + task-group stability gate: 12 batch entry points x 40 trials
      # must return 0 malformed results (exits non-zero otherwise).
      - name: Batch + task-group stability probe
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
        run: bun scripts/bench-batch.ts --probe

  # End-to-end compiled-server regression gate (native on vs fallback).
  # Benchmarks the AOT-compiled app server and compares native req/s against
  # the committed baseline + the in-run fallback (see scripts/check-server-bench.ts).
  # `bench/results/server/baseline.json` is COMMITTED (native-vs-baseline check is
  # live when run params match). HARD gate: the previous /api/big native-mode
  # overhead (~15-16%) was resolved (re-measured ~2% on 2026-08-19), so the perf
  # regression gate can fail CI again.
  server-bench:
    name: Server bench gate (real addon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ignex
        uses: actions/checkout@v4

      - name: Checkout castrum (Rust addon)
        uses: actions/checkout@v4
        with:
          repository: Axylabs/flux-rs
          path: castrum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ignex dependencies
        run: bun install --frozen-lockfile

      - name: Build castrum addon
        working-directory: castrum
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: End-to-end server bench (native vs fallback)
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
          REPEATS: "2"
          DURATION: "2"
          WARMUP: "1"
        run: bun scripts/bench-server.ts

      - name: Regression gate
        env:
          IGNEX_NATIVE_PATH: ${{ github.workspace }}/castrum/castrum.linux-x64-gnu.node
        run: bun scripts/check-server-bench.ts

  # Nova realtime transport: build the workspace @ignex/nova Rust addon, run
  # its suite (flatc-generated code is committed; NATS tests skip without
  # NATS_URL) and the end-to-end novaPlugin bridge (verify:nova) under plain
  # Bun. Previously verify:nova was broken in-repo (tsconfig paths shadowing)
  # and absent from CI — this job keeps the bridge honest.
  nova:
    name: Nova realtime transport (addon + plugin bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the nova Rust addon
        working-directory: packages/nova/rust
        run: cargo build --release

      - name: Stage the addon for the loader
        working-directory: packages/nova
        run: mkdir -p prebuilds/linux-x64 && cp rust/target/release/libignex_ffi.so prebuilds/linux-x64/

      - name: Typecheck (nova)
        run: bun run typecheck:nova

      - name: Test (nova suite)
        run: bun run test:nova

      - name: Verify novaPlugin end-to-end
        run: bun run verify:nova

  # Mongo toolkit (@ignex/ninox): unit suites run everywhere (live-Mongo tests
  # auto-skip via probe()), integration suites run against the CI Mongo 7
  # service. The standalone-package replica-set suites (hot-cache change
  # streams) stay in the upstream repo's own workflow.
  mongo:
    name: Mongo toolkit (ninox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (mongo)
        run: bun run typecheck:mongo

      - name: Test (mongo suite)
        env:
          MONGO_URL: mongodb://localhost:27017/
        run: bun run test:mongo

      - name: API-surface check
        working-directory: packages/mongo
        run: bun run check:api
