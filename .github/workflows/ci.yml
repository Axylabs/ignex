name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the Bun version (was `latest` — un-pinned drift across CI runs). Track the
# version the workspace is verified on (root package.json `engines.bun >= 1.4`);
# bump deliberately, never silently via `latest`.
env:
  BUN_VERSION: 1.4.2
  # Pin the castrum addon revision CI builds against — previously the DEFAULT
  # BRANCH floated, so CI validated a moving target that could be ahead of the
  # `^0.9.10` production install (a parity pass proved nothing about what users
  # actually get). Pinned to the v0.9.10 TAG commit, which is the exact revision
  # the registry serves (`castrum@0.9.10`). v0.9.10 adds the shared FFI ingress
  # binding (`getIngressBinding`) that `@ignex/native` delegates to — its absence
  # in the previous v0.9.6 pin is why the ingress-binding suite failed on every
  # lane. Everything v0.9.6 carried is still present (sharded `MetricsRegistry`,
  # `createPipeline`, route-wire v3, the optimized single-pass native route
  # parser, the JS-compatible form decoder, the NUL-safe byte-input validators,
  # and the off-thread task runtime). To move: bump BOTH this and
  # packages/native/package.json's optionalDependency deliberately, run
  # `bun run verify:native:ffi && bun run verify:native:route` locally first, and
  # keep vendor/castrum.d.ts in sync (`bun run check:native:surface`).
  CASTRUM_REF: 5b9d445ca1a7353b0fd19c3db2ba5708e1e871e9

jobs:
  # Fast, dependency-free gate: fail on any tracked file containing a likely
  # credential (npm/GitHub/AWS tokens, PEM private keys). Runs before install —
  # the scanner uses only `git ls-files` + `git show` (see scripts/scan-secrets.ts).
  secret-scan:
    name: Secret scan (no credentials in tracked files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun is NOT preinstalled on hosted runners — install the pinned
      # toolchain (no deps needed: scan-secrets.ts only shells out to git).
      - name: Set up Bun
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      - name: Scan tracked files for credentials
        run: bun scripts/scan-secrets.ts

  # Software supply-chain scanning (OSV): scans bun.lock + workspace manifests
  # against the OSV vulnerability database and reports findings as a SARIF
  # upload for the GitHub Security tab. Mirrors castrum's supply-chain job.
  supply-chain:
    name: Supply-chain scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repo-root action.yml is Marketplace metadata only — the runnable
      # (docker) action lives in the osv-scanner-action/ subdirectory.
      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            .

  # Quality gates across ALL supported platforms. Linux is the authoritative
  # lane (native addon present); macOS/Windows exercise the pure-TS fallback
  # end-to-end — typecheck, lint, tests, AOT build and both smoke modes must
  # pass WITHOUT an addon, which is what every non-linux-x64 user actually runs.
  quality:
    name: Quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun, git identity & deps
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # JS dependency audit: blocks on known high/critical advisories in the
      # resolved tree. Mirrors castrum's audit gate so both repos of the
      # framework meet the same supply-chain bar. Once per push (Linux lane).
      - name: JS dependency audit
        if: runner.os == 'Linux'
        run: bun audit --audit-level=high

      - name: Typecheck (root)
        run: bun run typecheck

      - name: Typecheck (CLI)
        run: bun run typecheck:cli

      - name: Lint (oxlint + biome)
        run: bun run lint

      - name: JSDoc completeness (every public export documented)
        run: bun run jsdoc:check:strict

      # Both gates are cheap and pure-Static-analysis, so they run on every OS
      # lane. They were previously only reachable through `verify:quick`, which
      # CI never invoked — which is how `RULES.md`/`AGENTS.md` could claim a
      # version the workspace was not on, and cite deleted docs/scripts.
      - name: Maintainability gate (size caps, doc refs, doc hub)
        run: bun run check:maintainability

      - name: Consistency gate (script/version/export drift)
        run: bun run check:consistency

      # Architecture fitness function: the one-way dependency rule
      # (`shared ← native ← core ← compiler ← cli`) used to live only in prose,
      # so a lower tier could import a higher one unnoticed. This also fails on
      # import cycles inside a package. See `docs/decisions/014-enforced-layers.md`.
      - name: Layers gate (one-way deps + import cycles)
        run: bun run check:layers

      # Dead-code scan (knip): unused files / deps + duplicate exports. It was
      # previously only reachable through the local `verify` chain, so dead
      # exports and duplicated command exports could accumulate unnoticed.
      # `includeEntryExports` stays false by design — the published export
      # surface is a contract frozen separately by `check:consistency`
      # (`scripts/api-surface.json`); see `knip.json`.
      - name: Dead-code scan (knip)
        if: runner.os == 'Linux'
        run: bun run check:dead

      - name: Test + coverage thresholds
        run: bun run test:coverage

      - name: Native bench sanity (fallback mode — no addon in this job)
        if: runner.os == 'Linux'
        run: bun run bench:native

      - name: Build (AOT compile example app)
        run: bun run build

      - name: Smoke (boot server + assert all routes/flows)
        run: bun run smoke

      - name: Smoke (fallback mode — no native addon on this lane)
        run: bun run smoke:fallback

      # AOT-compile + boot checks that the vitest suites don't cover (they need
      # plain Bun, not a vitest worker): RBAC guard-chain emission and the CLI
      # resource→AOT flow. Plus the release pre-flight: codegen/native-loader
      # changes must bump the compiler cache version.
      - name: AOT RBAC guard-chain verify
        run: bun run verify:aot:rbac

      - name: AOT abort short-circuit verify
        run: bun run verify:aot:abort

      - name: AOT specialized-plugin tier verify
        run: bun run verify:aot:plugin-specialized

      - name: CLI resource → AOT verify
        run: bun run verify:cli:resource
      # Real-driver contract check: the generated Drizzle resource is driven
      # through create/read/update/delete against a REAL `bun:sqlite` engine
      # (no service container required), so a codegen/template regression that
      # still typechecks fails here. The Mongo/NATS-backed suites stay out of
      # PR CI on purpose — they need live services, and the ninox-backed trace
      # test needs a sibling checkout.
      - name: Drizzle resource → real SQLite verify
        run: bun run verify:drizzle
      - name: Compiler cache-version check (vs last tag)
        if: runner.os == 'Linux'
        run: bun run check:cache-versions

      # SBOM: a standards-compliant SPDX 2.3 dependency inventory, generated
      # from the lockfile the build already trusts and uploaded as an artifact
      # for consumers / procurement / vulnerability response.
      - name: SBOM (SPDX 2.3 dependency inventory)
        if: runner.os == 'Linux'
        run: bun run sbom --out sbom.spdx.json

      - name: Upload SBOM
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: warn

      - name: Upload coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  # Real-addon parity on EVERY desktop/server platform: build the castrum NAPI
  # addon FROM SOURCE on each OS and run the native suites against it. This is
  # the gate that ends "linux-x64-only" drift — macOS (arm64) and Windows
  # (x64-msvc) prove the addon compiles AND passes byte-parity off-Linux, and
  # the loader discovers the platform binary without IGNEX_NATIVE_PATH hints.
  # Non-Linux lanes are currently allow-listed (`continue-on-error`) until
  # castrum publishes/verifies those targets — flip them to blocking as soon
  # as they go green; do NOT remove them.
  native-parity:
    name: Native parity (real addon, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - name: Checkout ignex
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun, git identity & deps
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build castrum addon (pinned ref) & export native path
        uses: ./.github/actions/native-prep
        with:
          castrum-ref: ${{ env.CASTRUM_REF }}

      # vendor/castrum.d.ts is the compile-time contract for @ignex/native —
      # fail loudly when the real addon surface drifts from it (renamed or
      # removed runtime exports would otherwise typecheck but break at runtime).
      - name: Native type-stub surface check
        run: bun run check:native:surface

      - name: Native parity + benchmark (real addon)
        run: |
          bun run test:native:real
          bun scripts/native-bench.ts

      # C-ABI scalar + per-route parity under PLAIN Bun (vitest workers can't
      # dlopen bun:ffi) — the ONLY checks that exercise the C-ABI bindings
      # directly. Hard gate: a binding/parity regression must fail loudly.
      - name: C-ABI scalar parity (plain Bun, real addon)
        run: bun run verify:native:ffi

      - name: Per-route native stack parity (plain Bun, real addon)
        run: bun run verify:native:route

      # C-ABI (bun:ffi) is the PRIMARY transport — force it so a bind/self-test
      # regression (or a Bun/ABI drift) fails loudly instead of silently falling
      # back to NAPI. `IGNEX_FFI_MODE=ffi` throws on any ffi failure.
      - name: Native tests — C-ABI (bun:ffi) forced
        env:
          IGNEX_FFI_MODE: ffi
        run: bun run test:native

      # NAPI stays the fallback (Node / stateful classes) — verify it still
      # passes parity when C-ABI is explicitly disabled.
      - name: Native tests — NAPI forced
        env:
          IGNEX_FFI_MODE: napi
        run: bun run test:native

      # Batch + task-group stability gate: 12 batch entry points x 40 trials
      # must return 0 malformed results (exits non-zero otherwise).
      - name: Batch + task-group stability probe
        run: bun scripts/bench-batch.ts --probe

  # End-to-end compiled-server regression gate (native on vs fallback).
  # Benchmarks the AOT-compiled app server and compares native req/s against
  # `bench/results/server/baseline.json` (when present) + the in-run fallback
  # (see scripts/check-server-bench.ts). NOTE: no baseline is committed today,
  # so the cross-run check degrades to `baseline = latest`; only the in-run
  # native-vs-fallback comparison is meaningful. Machine-sensitive, so this gate
  # intentionally stays LINUX-ONLY (a baseline measured on one runner class
  # cannot arbitrate regressions measured on another).
  # HARD gate: the previous /api/big native-mode overhead (~15-16%) was resolved
  # (re-measured ~2% on 2026-08-19), so the perf regression gate can fail CI again.
  server-bench:
    name: Server bench gate (real addon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ignex
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun, git identity & deps
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build castrum addon (pinned ref) & export native path
        uses: ./.github/actions/native-prep
        with:
          castrum-ref: ${{ env.CASTRUM_REF }}

      # IGNEX_NATIVE_PATH is exported at job level by the native-prep action.
      - name: End-to-end server bench (native vs fallback)
        env:
          REPEATS: "2"
          DURATION: "2"
          WARMUP: "1"
        run: bun scripts/bench-server.ts

      - name: Regression gate
        run: bun scripts/check-server-bench.ts
