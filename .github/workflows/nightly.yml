name: Nightly stability

# Scheduled stability sweep — runs the slow/expensive gates that don't belong
# on every PR: full native parity on plain Bun, malformed-input fuzz, and perf
# regression against the committed baseline. Failures here are real signals
# (drift in Bun/castrum, perf regressions, machine-sensitive flakes) — they do
# NOT block PRs but should be triaged.
#
# The long compare-bench SOAK is deliberately NOT scheduled: it needs ~75 min of
# runner time, and a sustained soak is a LOCAL/manual activity, not a nightly
# tax on shared runners. It is gated behind the `run_soak` workflow_dispatch
# input (default false) — run `bun run bench:compare:soak` locally instead.
#
# The Rust-side catch_unwind/malformed-FFI fuzz (castrum, Axylabs/flux-rs)
# remains cross-repo; the JS-side malformed-input fuzz below covers the request-
# path decoders that run on every server.
on:
  schedule:
    # 02:00 UTC daily.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_soak:
        description: "Run the long compare-bench soak (~75 min of runner time) — opt-in only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2
  # Pinned castrum revision (see ci.yml CASTRUM_REF for the bump procedure) —
  # the nightly sweep must exercise the SAME addon production installs. Pinned
  # to the v0.9.6 TAG commit (== registry `castrum@0.9.6`), which builds from
  # source (sha2 realigned on digest 0.10) and carries the full native surface.
  CASTRUM_REF: fadc8af331f4829b8d0f917450b66dec65c53073

jobs:
  native-parity:
    name: Native parity + C-ABI (plain Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ignex
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun, git identity & deps
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build castrum addon (pinned ref) & export native path
        uses: ./.github/actions/native-prep
        with:
          castrum-ref: ${{ env.CASTRUM_REF }}

      # IGNEX_NATIVE_PATH is exported at job level by native-prep.
      - name: C-ABI scalar parity (plain Bun)
        run: bun run verify:native:ffi

      - name: Per-route native stack parity (plain Bun)
        run: bun run verify:native:route

      - name: Native suite (real addon)
        run: bun run test:native:real

  malformed-input-fuzz:
    name: Malformed-input fuzz (JS side)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ignex
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun, git identity & deps
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Deterministic malformed-input fuzz over the request-path decoders
      # (cookies/query/form/WS frames/multipart): adversarial input must never
      # throw, and native+fallback must agree. Fails on any violation.
      - name: Malformed-input fuzz
        run: bun run fuzz:malformed

  perf-regression:
    name: Perf regression vs committed baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ignex
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun, git identity & deps
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build castrum addon (pinned ref) & export native path
        uses: ./.github/actions/native-prep
        with:
          castrum-ref: ${{ env.CASTRUM_REF }}

      # IGNEX_NATIVE_PATH is exported at job level by native-prep.
      - name: End-to-end server bench (CI params)
        env:
          REPEATS: "2"
          DURATION: "2"
          WARMUP: "1"
        run: bun scripts/bench-server.ts

      - name: Regression gate (vs committed baseline + fallback band)
        run: bun scripts/check-server-bench.ts

  soak:
    name: Compare-bench soak
    # OPT-IN ONLY (workflow_dispatch `run_soak`): the soak scenarios are
    # DURATION-heavy by design — `05-soak` runs a 600s phase and
    # `18-json-validation-soak` a 300s phase, each across ALL 5 participants
    # (bun, elysia, ignus, ignus-native, ignus-aot) = ~75 min of phases plus
    # boot/teardown. That is far too much runner time to spend daily, so the job
    # never runs on the schedule; use `bun run bench:compare:soak` locally.
    if: ${{ inputs.run_soak == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun, git identity & deps
        uses: ./.github/actions/ci-setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Soak (long-running flow stability)
        run: bun run bench:compare:soak

      - name: Validate compare reports
        run: bun run bench:compare:check

      # Elysia-relative perf gate: ignus-aot per-route median p50 must be ≤
      # elysia × tolerance (see scripts/check-compare-gate.ts). Fails the
      # nightly on a real regression; KNOWN_SLOWER scenarios carry their own
      # (looser) tolerance so the gate is honest, not skipped.
      - name: Compare gate (ignus-aot vs elysia)
        run: bun run bench:compare:gate
