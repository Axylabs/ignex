name: "Set up Bun, git identity & deps"
description: >-
  Shared job bootstrap: install the pinned Bun toolchain (+ cache), configure a
  deterministic git identity, and run a frozen workspace install. Every CI job
  uses this so versions, caching and identity stay consistent repo-wide.
inputs:
  bun-version:
    description: "Exact Bun version to install (callers pass env.BUN_VERSION)."
    required: true
  install:
    description: >-
      Set 'false' for tool-only jobs (no `bun install`). git identity is still
      configured so test jobs that create git tags never fail.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install Bun ${{ inputs.bun-version }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # Pins in this composite action are bumped BY HAND: Dependabot's
    # `github-actions` updates only rewrite `.github/workflows/*.yml` (its actions
    # PRs never touch `.github/actions/**`), which is how this one drifted onto
    # the deprecated Node 20 runtime while the workflows moved on. Keep the
    # `# vX.Y.Z` comment in sync when bumping — `actions/cache@v4` was the source
    # of CI's "Node.js 20 is deprecated" warning, v5+ runs on Node 24.
    - name: Cache Bun install cache
      if: ${{ inputs.install == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    # Hosted runners ship no git identity; `packages/core/test/clients.test.ts`
    # creates annotated git tags and fails with "Committer identity unknown".
    # A deterministic bot identity keeps every git-writing test hermetic.
    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: bun install --frozen-lockfile
