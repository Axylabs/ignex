name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Optionally re-run the (non-blocking) benchmark on a schedule.
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint + format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  audit:
    name: Dependency audit (bun audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun audit

  test:
    name: Tests + coverage (Mongo 7 standalone)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)' --username admin --password admin --authenticationDatabase admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches the default MONGO_URL used by every Mongo-backed suite.
      MONGO_URL: mongodb://admin:admin@localhost:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Run tests with coverage (lcov)
        run: bun test --coverage --coverage-reporter=lcov
      - name: Enforce coverage threshold (>= 85% lines)
        run: |
          awk '
            /^LF:/ { sub(/^LF:/, ""); lf += $0 }
            /^LH:/ { sub(/^LH:/, ""); lh += $0 }
            END {
              pct = (lh / lf) * 100;
              printf "Line coverage: %.1f%% (%d/%d)\n", pct, lh, lf;
              if (pct < 85) { print "Coverage below threshold (85%)"; exit 1 }
            }
          ' coverage/lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  examples:
    name: Examples + demo (Mongo 7 standalone)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)' --username admin --password admin --authenticationDatabase admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://admin:admin@localhost:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run every example + the demo
        run: |
          set -e
          for f in examples/[0-9]*.ts; do
            echo "→ $f"
            bun run "$f"
          done
          echo "→ index.ts (demo)"
          bun run index.ts

  # HotCache change-stream invalidation and the replica-only suites only run
  # against a real replica set — the standalone Mongo service above skips them.
  # This job is the only place those code paths are exercised in CI.
  replica:
    name: Replica-set tests (HotCache change streams)
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: supercharge/mongodb-github-action@v1
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: 'rs0'
      - run: bun install --frozen-lockfile
      - name: Run replica-only + hot-cache suites
        run: bun test tests/hot-cache.test.ts tests/hot-cache-mongo.test.ts tests/hot-cache-resync.test.ts tests/cache-invalidation.test.ts

  # Publishability gate: build → npm pack → install the tarball in a fresh
  # Node consumer → typecheck (NodeNext) + run against the built dist.
  package:
    name: Package smoke (npm pack → Node consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack and verify contents
        run: npm pack --dry-run
      - name: Install tarball in a fresh Node consumer
        run: |
          npm pack --pack-destination /tmp >/dev/null
          TGZ=$(ls /tmp/ignex-ninox-*.tgz | head -1)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null 2>&1
          npm i "$TGZ" typescript@^6.0.3 @types/node@^24 >/dev/null 2>&1
          # Runtime check against the built dist (plain Node ESM)
          cat > index.mjs <<'EOF'
          import { s, toMongoValidator } from '@ignex/ninox';
          import { stableHash } from '@ignex/ninox/utils';
          const v = toMongoValidator(s.object({ _id: s.objectId() }, { name: 'x' }));
          if (!v.$jsonSchema || v.$jsonSchema.bsonType !== 'object') process.exit(1);
          console.log('consumer-ok', stableHash(['x', 1]));
          EOF
          node index.mjs
          # Typecheck against the published d.ts (NodeNext resolution)
          cat > index.mts <<'EOF'
          import { s, type InferDoc } from '@ignex/ninox';
          import { stableHash } from '@ignex/ninox/utils';
          const x = s.object({ _id: s.objectId(), email: s.string() }, { name: 'users' });
          type User = InferDoc<typeof x>;
          const h = stableHash(['a', 1]);
          export type { User };
          export { h };
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["node"]
            },
            "include": ["index.mts"]
          }
          EOF
          npx tsc --noEmit

  # Benchmarks are timing-sensitive (wall-clock ops/s) and can flake in shared
  # CI runners — run them but never let a slow run block the pipeline.
  bench:
    name: Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)' --username admin --password admin --authenticationDatabase admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://admin:admin@localhost:27017/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run bench
      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: bench/results/summary.json
          if-no-files-found: warn

