[package]
name = "ignex-nova-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "ignex_ffi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
flatbuffers = "25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
