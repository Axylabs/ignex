name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (empty = use package.json version)"
        required: false
        default: ""
      dist_tag:
        description: "npm dist-tag"
        required: false
        default: "latest"
  push:
    tags:
      - "v*"

jobs:
  # Build + stage the Rust cdylib into `prebuilds/<platform>-<arch>/` per OS.
  # Consumers on these platforms get a working addon with zero build steps;
  # other platforms rebuild from the shipped rust/ source or set IGNEX_FFI_PATH.
  build-prebuilds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install flatbuffers compiler
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y flatbuffers-compiler
          else
            brew install flatbuffers
          fi

      - name: Install dependencies
        run: bun install

      - name: Generate (TypeBox → .fbs → flatc → glue)
        run: bun run generate

      - name: Build + stage prebuild addon
        run: bun run prebuild

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}
          path: prebuilds/
          if-no-files-found: error

  publish:
    needs: build-prebuilds
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install flatbuffers compiler
        run: sudo apt-get update && sudo apt-get install -y flatbuffers-compiler

      - name: Install dependencies
        run: bun install

      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prebuild-*

      - name: Merge prebuilds into prebuilds/
        run: |
          mkdir -p prebuilds
          for dir in artifacts/prebuild-*/prebuilds/*; do
            [ -d "$dir" ] || continue
            tag="$(basename "$dir")"
            mkdir -p "prebuilds/$tag"
            cp -r "$dir/." "prebuilds/$tag/"
          done
          rm -rf artifacts
          echo "→ prebuilds:" && ls -R prebuilds

      - name: Set version from tag (push)
        if: github.ref_type == 'tag'
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ github.ref_name }}'.replace(/^v/,'');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Set version from input (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ github.event.inputs.version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Verify + tarball check
        run: |
          bun run generate
          bun run verify
          bun run pack:check

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"
          tag="${{ github.event.inputs.dist_tag || 'latest' }}"
          bun publish --tag "$tag" --access public
